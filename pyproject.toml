[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "emby-mcp"
version = "1.3.0"
description = "MCP server for complete Emby management"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.1.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
emby-mcp = "emby_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
